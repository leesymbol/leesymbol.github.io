<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>积分兑换 - 德州财金集团</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @font-face {
      font-family: 'SerifFont';
      src: local('SimSun'), local('Songti SC');
    }
  </style>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'chinese-red': '#C42B1C',
            'luxury-gold': '#D4AF37',
            'deep-red': '#8B0000',
            'cream-white': '#F8F4E9'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-amber-50 flex justify-center items-center min-h-screen p-4">
<div class="w-[375px] h-[812px] bg-white border-4 border-luxury-gold rounded-2xl shadow-2xl overflow-hidden flex flex-col">
<!-- 顶部标题栏 -->
<header class="h-14 bg-chinese-red flex items-center justify-between px-4">
<div class="flex items-center">
<iconify-icon class="text-amber-300 text-2xl cursor-pointer" icon="mdi:chevron-left" id="back-btn"></iconify-icon>
<!-- <iconify-icon class="text-amber-300 text-2xl ml-2" icon="mdi:bank"></iconify-icon>
<span class="text-white font-serif font-bold text-xl ml-2">德州财金集团</span> -->
</div>
<div class="flex space-x-3">
<iconify-icon class="text-amber-300 text-xl" icon="mdi:bell-outline"></iconify-icon>
<iconify-icon class="text-amber-300 text-xl" icon="mdi:account-circle"></iconify-icon>
</div>
</header>
<!-- 内容区 -->
<main class="flex-1 overflow-y-auto hide-scrollbar">
<!-- 积分兑换页面 -->
<div class="p-4" id="points-exchange-page">
<h2 class="font-serif font-bold text-xl text-chinese-red mb-4 text-center">积分兑换</h2>

<!-- 积分余额卡片 -->
<section class="mb-6">
<div class="bg-gradient-to-r from-chinese-red to-amber-700 rounded-xl p-4 text-white">
<div class="flex justify-between items-center mb-2">
<h3 class="font-bold text-lg">我的积分</h3>
<iconify-icon class="text-amber-300 text-xl" icon="mdi:coin"></iconify-icon>
</div>
<div class="flex items-end">
<span class="text-3xl font-bold">1,250</span>
<span class="text-sm ml-1 mb-1">积分</span>
</div>
<p class="text-xs mt-2 opacity-90">积分可用于兑换精美礼品和抵扣服务费用</p>
</div>
</section>

<!-- 积分规则 -->
<section class="mb-6">
<div class="bg-white border border-amber-200 rounded-xl p-4">
<h3 class="font-bold text-chinese-red mb-3">积分规则</h3>
<div class="grid grid-cols-2 gap-3">
<div class="flex items-center">
<iconify-icon class="text-amber-600 mr-2" icon="mdi:calendar-check"></iconify-icon>
<span class="text-xs text-gray-700">每日签到 +5积分</span>
</div>
<div class="flex items-center">
<iconify-icon class="text-amber-600 mr-2" icon="mdi:cash"></iconify-icon>
<span class="text-xs text-gray-700">消费1元 +1积分</span>
</div>
<div class="flex items-center">
<iconify-icon class="text-amber-600 mr-2" icon="mdi:ticket"></iconify-icon>
<span class="text-xs text-gray-700">参与活动 +10积分</span>
</div>
<div class="flex items-center">
<iconify-icon class="text-amber-600 mr-2" icon="mdi:cake-variant"></iconify-icon>
<span class="text-xs text-gray-700">生日当月双倍积分</span>
</div>
</div>
</div>
</section>

<!-- 兑换商品分类 -->
<section class="mb-6">
<h3 class="font-bold text-chinese-red mb-3">兑换商品分类</h3>
<div class="grid grid-cols-4 gap-3">
<!-- 分类1 -->
<div class="flex flex-col items-center cursor-pointer">
<div class="w-12 h-12 bg-chinese-red rounded-full flex items-center justify-center mb-1">
<iconify-icon class="text-white text-xl" icon="mdi:package"></iconify-icon>
</div>
<span class="text-xs font-bold text-chinese-red">实物礼品</span>
</div>

<!-- 分类2 -->
<div class="flex flex-col items-center cursor-pointer">
<div class="w-12 h-12 bg-chinese-red rounded-full flex items-center justify-center mb-1">
<iconify-icon class="text-white text-xl" icon="mdi:ticket-percent"></iconify-icon>
</div>
<span class="text-xs font-bold text-chinese-red">优惠券</span>
</div>

<!-- 分类3 -->
<div class="flex flex-col items-center cursor-pointer">
<div class="w-12 h-12 bg-chinese-red rounded-full flex items-center justify-center mb-1">
<iconify-icon class="text-white text-xl" icon="mdi:ticket-confirmation"></iconify-icon>
</div>
<span class="text-xs font-bold text-chinese-red">活动门票</span>
</div>

<!-- 分类4 -->
<div class="flex flex-col items-center cursor-pointer">
<div class="w-12 h-12 bg-chinese-red rounded-full flex items-center justify-center mb-1">
<iconify-icon class="text-white text-xl" icon="mdi:cash-100"></iconify-icon>
</div>
<span class="text-xs font-bold text-chinese-red">抵扣券</span>
</div>
</div>
</section>

<!-- 热门兑换商品 -->
<section class="mb-6">
<h3 class="font-bold text-chinese-red mb-3">热门兑换商品</h3>
<div class="grid grid-cols-2 gap-3">
<!-- 商品1 -->
<div class="bg-white border border-amber-200 rounded-xl overflow-hidden shadow-sm">
<div class="h-32 bg-gradient-to-b from-amber-50 to-amber-100 flex items-center justify-center">
<iconify-icon class="text-amber-500 text-4xl" icon="mdi:cup"></iconify-icon>
</div>
<div class="p-3">
<h4 class="font-bold text-sm text-chinese-red mb-1">咖啡杯</h4>
<div class="flex justify-between items-center mb-2">
<span class="text-xs text-gray-600">精美陶瓷</span>
<span class="text-sm font-bold text-chinese-red">500积分</span>
</div>
<button class="w-full bg-chinese-red text-white text-xs font-bold py-1 px-2 rounded-lg">立即兑换</button>
</div>
</div>

<!-- 商品2 -->
<div class="bg-white border border-amber-200 rounded-xl overflow-hidden shadow-sm">
<div class="h-32 bg-gradient-to-b from-amber-50 to-amber-100 flex items-center justify-center">
<iconify-icon class="text-blue-500 text-4xl" icon="mdi:book"></iconify-icon>
</div>
<div class="p-3">
<h4 class="font-bold text-sm text-chinese-red mb-1">精美书籍</h4>
<div class="flex justify-between items-center mb-2">
<span class="text-xs text-gray-600">文学经典</span>
<span class="text-sm font-bold text-chinese-red">800积分</span>
</div>
<button class="w-full bg-chinese-red text-white text-xs font-bold py-1 px-2 rounded-lg">立即兑换</button>
</div>
</div>

<!-- 商品3 -->
<div class="bg-white border border-amber-200 rounded-xl overflow-hidden shadow-sm">
<div class="h-32 bg-gradient-to-b from-amber-50 to-amber-100 flex items-center justify-center">
<iconify-icon class="text-purple-500 text-4xl" icon="mdi:umbrella"></iconify-icon>
</div>
<div class="p-3">
<h4 class="font-bold text-sm text-chinese-red mb-1">晴雨伞</h4>
<div class="flex justify-between items-center mb-2">
<span class="text-xs text-gray-600">防紫外线</span>
<span class="text-sm font-bold text-chinese-red">1,200积分</span>
</div>
<button class="w-full bg-chinese-red text-white text-xs font-bold py-1 px-2 rounded-lg">立即兑换</button>
</div>
</div>

<!-- 商品4 -->
<div class="bg-white border border-amber-200 rounded-xl overflow-hidden shadow-sm">
<div class="h-32 bg-gradient-to-b from-amber-50 to-amber-100 flex items-center justify-center">
<iconify-icon class="text-green-500 text-4xl" icon="mdi:headphones"></iconify-icon>
</div>
<div class="p-3">
<h4 class="font-bold text-sm text-chinese-red mb-1">耳机</h4>
<div class="flex justify-between items-center mb-2">
<span class="text-xs text-gray-600">无线蓝牙</span>
<span class="text-sm font-bold text-chinese-red">2,500积分</span>
</div>
<button class="w-full bg-chinese-red text-white text-xs font-bold py-1 px-2 rounded-lg">立即兑换</button>
</div>
</div>
</div>
</section>

<!-- 兑换历史 -->
<section class="mb-6">
<h3 class="font-bold text-chinese-red mb-3">兑换历史</h3>
<div class="bg-white border border-amber-200 rounded-xl">
<!-- 兑换历史项 -->
<div class="p-3 border-b border-amber-200">
<div class="flex justify-between items-center mb-1">
<span class="text-sm font-bold">咖啡杯</span>
<span class="text-sm text-chinese-red font-bold">-500积分</span>
</div>
<div class="flex justify-between items-center">
<span class="text-xs text-gray-600">2025-12-10</span>
<span class="text-xs bg-green-100 text-green-600 px-2 py-0.5 rounded-full">已兑换</span>
</div>
</div>
<div class="p-3 border-b border-amber-200">
<div class="flex justify-between items-center mb-1">
<span class="text-sm font-bold">10元优惠券</span>
<span class="text-sm text-chinese-red font-bold">-200积分</span>
</div>
<div class="flex justify-between items-center">
<span class="text-xs text-gray-600">2025-12-05</span>
<span class="text-xs bg-green-100 text-green-600 px-2 py-0.5 rounded-full">已兑换</span>
</div>
</div>
<div class="p-3">
<div class="flex justify-between items-center mb-1">
<span class="text-sm font-bold">精美笔记本</span>
<span class="text-sm text-chinese-red font-bold">-300积分</span>
</div>
<div class="flex justify-between items-center">
<span class="text-xs text-gray-600">2025-11-28</span>
<span class="text-xs bg-green-100 text-green-600 px-2 py-0.5 rounded-full">已兑换</span>
</div>
</div>
</div>
</section>
</div>
</main>
<!-- 底部导航栏 -->
<nav class="h-20 bg-white border-t border-amber-300 flex justify-around items-center">
<div class="text-center text-gray-400 cursor-pointer nav-item" data-page="home">
<iconify-icon class="text-2xl block mx-auto" icon="mdi:home"></iconify-icon>
<span class="text-xs mt-1">首页</span>
</div>
<div class="text-center text-gray-400 cursor-pointer nav-item" data-page="activity">
<iconify-icon class="text-2xl block mx-auto" icon="mdi:calendar"></iconify-icon>
<span class="text-xs mt-1">活动</span>
</div>
<div class="text-center text-gray-400 cursor-pointer nav-item" data-page="profile">
<iconify-icon class="text-2xl block mx-auto" icon="mdi:account"></iconify-icon>
<span class="text-xs mt-1">我的</span>
</div>
</nav>
</div>
<script>
    // 返回按钮点击事件
    document.getElementById('back-btn').addEventListener('click', function() {
          window.location.href = '德州财金集团H5.html#activity-page';
    });
    
    // 页面切换功能 - 跳转到主页面对应模块
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', function() {
        const pageType = this.dataset.page;
        if (pageType === 'home') {
          window.location.href = '德州财金集团H5.html#home';
        } else if (pageType === 'activity') {
          window.location.href = '德州财金集团H5.html#activity';
        } else if (pageType === 'profile') {
          window.location.href = '德州财金集团H5.html#profile';
        }
      });
    });
  </script>
</body>
</html>
