<style>
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @font-face {
      font-family: 'SerifFont';
      src: local('SimSun'), local('Songti SC');
    }
  </style>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'chinese-red': '#C42B1C',
            'luxury-gold': '#D4AF37',
            'deep-red': '#8B0000',
            'cream-white': '#F8F4E9'
          }
        }
      }
    }
  </script>

<!-- 分类2 -->

<span class="text-xs text-gray-600">14英寸</span>
<span class="text-sm font-bold text-chinese-red">¥3,299.00</span>

<div class="mt-1">

<span class="text-xs bg-chinese-red text-white px-2 py-1 rounded-full">2件商品</span>
</div>
<div class="flex justify-between items-center">
<span class="text-sm font-bold">合计：</span>
<span class="text-lg font-bold text-chinese-red">¥398.00</span>
</div>
<button class="w-full bg-chinese-red text-white font-bold py-2 px-4 rounded-lg mt-2">去结算</button>

</div>
</nav>
