<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>水费缴纳 - 德州财金集团</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar {
          display: none;
        }
        .hide-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
        }
        @font-face {
          font-family: 'SerifFont';
          src: local('SimSun'), local('Songti SC');
        }
      </style>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                'chinese-red': '#C42B1C',
                'luxury-gold': '#D4AF37',
                'deep-red': '#8B0000',
                'cream-white': '#F8F4E9'
              }
            }
          }
        }
      </script>
</head>
<body class="bg-amber-50 flex justify-center items-center min-h-screen p-4">
    <div class="w-[375px] h-[812px] bg-white border-4 border-luxury-gold rounded-2xl shadow-2xl overflow-hidden flex flex-col">
        <!-- 顶部标题栏 -->
        <header class="h-14 bg-chinese-red flex items-center justify-between px-4">
            <div class="flex items-center">
                <iconify-icon class="text-amber-300 text-2xl cursor-pointer" icon="mdi:chevron-left" id="back-btn"></iconify-icon>
                <iconify-icon class="text-amber-300 text-2xl ml-2" icon="mdi:bank"></iconify-icon>
                <span class="text-white font-serif font-bold text-xl ml-2">德州财金集团</span>
            </div>
            <div class="flex space-x-3">
                <iconify-icon class="text-amber-300 text-xl" icon="mdi:bell-outline"></iconify-icon>
                <iconify-icon class="text-amber-300 text-xl" icon="mdi:account-circle"></iconify-icon>
            </div>
        </header>
        
        <!-- 内容区 -->
        <main class="flex-1 overflow-y-auto hide-scrollbar">
            <div class="p-4">
                <h2 class="font-serif font-bold text-2xl text-chinese-red mb-4 text-center">水费缴纳</h2>
                
                <!-- 水费查询表单 -->
                <div class="bg-white border border-amber-200 rounded-xl p-4 mb-6">
                    <h3 class="font-bold text-lg text-chinese-red mb-3">查询水费</h3>
                    <form id="bill-query-form" class="space-y-3">
                        <div>
                            <label class="block text-sm font-bold text-chinese-red mb-1">户号</label>
                            <input type="text" id="household-number" class="w-full px-3 py-2 border border-amber-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-chinese-red" placeholder="请输入您的水费户号">
                        </div>
                        <div class="flex space-x-2">
                            <div class="flex-1">
                                <label class="block text-sm font-bold text-chinese-red mb-1">验证码</label>
                                <input type="text" class="w-full px-3 py-2 border border-amber-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-chinese-red" placeholder="请输入验证码">
                            </div>
                            <div class="flex items-end">
                                <button type="button" class="bg-amber-500 text-white text-xs font-bold py-2 px-3 rounded-lg">获取验证码</button>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-chinese-red text-white font-bold py-2 px-4 rounded-lg hover:bg-deep-red transition-colors duration-200">
                            查询水费
                        </button>
                    </form>
                </div>
                
                <!-- 水费账单信息 -->
                <div class="bg-white border border-amber-200 rounded-xl p-4 mb-6">
                    <h3 class="font-bold text-lg text-chinese-red mb-3">水费账单</h3>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">户号</span>
                            <span class="font-bold">123456789</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">用户姓名</span>
                            <span class="font-bold">王先生</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">抄表周期</span>
                            <span class="font-bold">2025-11</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">用水量</span>
                            <span class="font-bold">35 m³</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">水费金额</span>
                            <span class="text-2xl font-bold text-chinese-red">¥ 87.50</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">截止日期</span>
                            <span class="text-amber-500 font-bold">2025-12-31</span>
                        </div>
                    </div>
                </div>
                
                <!-- 缴费方式 -->
                <div class="bg-white border border-amber-200 rounded-xl p-4 mb-6">
                    <h3 class="font-bold text-lg text-chinese-red mb-3">缴费方式</h3>
                    <div class="space-y-3">
                        <div class="flex items-center justify-between p-3 bg-amber-50 rounded-lg border border-amber-200">
                            <div class="flex items-center">
                                <div class="w-6 h-6 rounded-full border-2 border-chinese-red flex items-center justify-center mr-3">
                                    <div class="w-3 h-3 bg-chinese-red rounded-full"></div>
                                </div>
                                <div class="flex items-center">
                                    <iconify-icon class="text-green-500 text-2xl mr-2" icon="mdi:wechat"></iconify-icon>
                                    <span class="font-bold">微信支付</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between p-3 bg-amber-50 rounded-lg border border-amber-200">
                            <div class="flex items-center">
                                <div class="w-6 h-6 rounded-full border-2 border-amber-300 flex items-center justify-center mr-3"></div>
                                <div class="flex items-center">
                                    <iconify-icon class="text-blue-500 text-2xl mr-2" icon="mdi:alipay"></iconify-icon>
                                    <span class="font-bold">支付宝</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between p-3 bg-amber-50 rounded-lg border border-amber-200">
                            <div class="flex items-center">
                                <div class="w-6 h-6 rounded-full border-2 border-amber-300 flex items-center justify-center mr-3"></div>
                                <div class="flex items-center">
                                    <iconify-icon class="text-purple-500 text-2xl mr-2" icon="mdi:credit-card"></iconify-icon>
                                    <span class="font-bold">银行卡</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between p-3 bg-amber-50 rounded-lg border border-amber-200">
                            <div class="flex items-center">
                                <div class="w-6 h-6 rounded-full border-2 border-amber-300 flex items-center justify-center mr-3"></div>
                                <div class="flex items-center">
                                    <iconify-icon class="text-amber-500 text-2xl mr-2" icon="mdi:coin"></iconify-icon>
                                    <span class="font-bold">积分抵扣</span>
                                </div>
                            </div>
                            <span class="text-sm text-gray-500">可用积分：1250</span>
                        </div>
                    </div>
                </div>
                
                <!-- 立即缴纳按钮 -->
                <div class="p-4">
                    <button id="pay-btn" class="w-full bg-chinese-red text-white font-bold text-xl py-3 px-4 rounded-lg hover:bg-deep-red transition-colors duration-200">
                        立即缴纳 ¥ 87.50
                    </button>
                </div>
                
                <!-- 缴费记录 -->
                <div class="bg-white border border-amber-200 rounded-xl p-4 mb-6">
                    <h3 class="font-bold text-lg text-chinese-red mb-3">缴费记录</h3>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center pb-3 border-b border-amber-100">
                            <div class="flex items-center">
                                <iconify-icon class="text-green-500 text-xl mr-3" icon="mdi:check-circle"></iconify-icon>
                                <div>
                                    <div class="font-bold">2025-10-15</div>
                                    <div class="text-xs text-gray-500">水费缴纳</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="font-bold text-chinese-red">-¥ 92.00</div>
                                <div class="text-xs text-gray-500">已完成</div>
                            </div>
                        </div>
                        <div class="flex justify-between items-center pb-3 border-b border-amber-100">
                            <div class="flex items-center">
                                <iconify-icon class="text-green-500 text-xl mr-3" icon="mdi:check-circle"></iconify-icon>
                                <div>
                                    <div class="font-bold">2025-09-20</div>
                                    <div class="text-xs text-gray-500">水费缴纳</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="font-bold text-chinese-red">-¥ 85.00</div>
                                <div class="text-xs text-gray-500">已完成</div>
                            </div>
                        </div>
                        <div class="flex justify-between items-center">
                            <div class="flex items-center">
                                <iconify-icon class="text-green-500 text-xl mr-3" icon="mdi:check-circle"></iconify-icon>
                                <div>
                                    <div class="font-bold">2025-08-18</div>
                                    <div class="text-xs text-gray-500">水费缴纳</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="font-bold text-chinese-red">-¥ 78.50</div>
                                <div class="text-xs text-gray-500">已完成</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- 底部导航栏 -->
        <nav class="h-20 bg-white border-t border-amber-300 flex justify-around items-center">
            <div class="text-center text-gray-400 cursor-pointer nav-item" data-page="home">
                <iconify-icon class="text-2xl block mx-auto" icon="mdi:home"></iconify-icon>
                <span class="text-xs mt-1">首页</span>
            </div>
            <div class="text-center text-gray-400 cursor-pointer nav-item" data-page="activity">
                <iconify-icon class="text-2xl block mx-auto" icon="mdi:calendar"></iconify-icon>
                <span class="text-xs mt-1">活动</span>
            </div>
            <div class="text-center text-gray-400 cursor-pointer nav-item" data-page="profile">
                <iconify-icon class="text-2xl block mx-auto" icon="mdi:account"></iconify-icon>
                <span class="text-xs mt-1">我的</span>
            </div>
        </nav>
    </div>
    
    <script>
        // 水费查询表单提交事件
        document.getElementById('bill-query-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('查询成功！');
        });
        
        // 立即缴纳按钮点击事件
        document.getElementById('pay-btn').addEventListener('click', function() {
            alert('缴纳成功！');
        });
        
        // 返回按钮点击事件
        document.getElementById('back-btn').addEventListener('click', function() {
                 window.location.href = '德州财金集团H5.html#activity-page';
        });
        
        // 导航栏点击事件 - 跳转到主页面对应模块
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                const page = this.dataset.page;
                window.location.href = `德州财金集团H5.html#${page}`;
            });
        });
    </script>
</body>
</html>
