<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>签到领积分 - 德州财金集团</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar {
          display: none;
        }
        .hide-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
        }
        @font-face {
          font-family: 'SerifFont';
          src: local('SimSun'), local('Songti SC');
        }
      </style>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                'chinese-red': '#C42B1C',
                'luxury-gold': '#D4AF37',
                'deep-red': '#8B0000',
                'cream-white': '#F8F4E9'
              }
            }
          }
        }
      </script>
</head>
<body class="bg-amber-50 flex justify-center items-center min-h-screen p-4">
    <div class="w-[375px] h-[812px] bg-white border-4 border-luxury-gold rounded-2xl shadow-2xl overflow-hidden flex flex-col">
        <!-- 顶部标题栏 -->
        <header class="h-14 bg-chinese-red flex items-center justify-between px-4">
            <div class="flex items-center">
                 <iconify-icon class="text-amber-300 text-2xl cursor-pointer" icon="mdi:chevron-left" id="back-btn"></iconify-icon>
                <!-- <iconify-icon class="text-amber-300 text-2xl" icon="mdi:bank"></iconify-icon> -->
                <!-- <span class="text-white font-serif font-bold text-xl ml-2">德州财金集团</span> -->
            </div>
            <div class="flex space-x-3">
                <iconify-icon class="text-amber-300 text-xl" icon="mdi:bell-outline"></iconify-icon>
                <iconify-icon class="text-amber-300 text-xl" icon="mdi:account-circle"></iconify-icon>
            </div>
        </header>
        
        <!-- 内容区 -->
        <main class="flex-1 overflow-y-auto hide-scrollbar">
            <div class="p-4">
                <h2 class="font-serif font-bold text-2xl text-chinese-red mb-4 text-center">签到领积分</h2>
                
                <!-- 签到状态卡片 -->
                <div class="bg-gradient-to-r from-chinese-red to-amber-700 rounded-xl p-4 text-white mb-6">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-bold">今日签到</h3>
                        <span class="text-amber-300">已连续签到 7 天</span>
                    </div>
                    <div class="flex items-end">
                        <span class="text-3xl font-bold">+5</span>
                        <span class="text-sm ml-1 mb-1">积分</span>
                    </div>
                    <button id="check-in-btn" class="bg-white text-chinese-red font-bold py-2 px-6 rounded-full hover:bg-amber-100 transition-colors duration-200 mt-3">
                        立即签到
                    </button>
                </div>
                
                <!-- 签到日历 -->
                <div class="mb-6">
                    <h3 class="font-bold text-lg text-chinese-red mb-3">签到日历</h3>
                    <div class="bg-white border border-amber-200 rounded-xl p-3">
                        <div class="flex justify-between items-center mb-3">
                            <button class="text-chinese-red">
                                <iconify-icon icon="mdi:chevron-left"></iconify-icon>
                            </button>
                            <span class="font-bold">2025年12月</span>
                            <button class="text-chinese-red">
                                <iconify-icon icon="mdi:chevron-right"></iconify-icon>
                            </button>
                        </div>
                        
                        <!-- 星期标题 -->
                        <div class="grid grid-cols-7 gap-1 mb-2">
                            <div class="text-center text-xs text-gray-500">日</div>
                            <div class="text-center text-xs text-gray-500">一</div>
                            <div class="text-center text-xs text-gray-500">二</div>
                            <div class="text-center text-xs text-gray-500">三</div>
                            <div class="text-center text-xs text-gray-500">四</div>
                            <div class="text-center text-xs text-gray-500">五</div>
                            <div class="text-center text-xs text-gray-500">六</div>
                        </div>
                        
                        <!-- 日历网格 -->
                        <div class="grid grid-cols-7 gap-1">
                            <!-- 上个月日期 -->
                            <div class="text-center text-xs text-gray-300 p-2">24</div>
                            <div class="text-center text-xs text-gray-300 p-2">25</div>
                            <div class="text-center text-xs text-gray-300 p-2">26</div>
                            <div class="text-center text-xs text-gray-300 p-2">27</div>
                            <div class="text-center text-xs text-gray-300 p-2">28</div>
                            <div class="text-center text-xs text-gray-300 p-2">29</div>
                            <div class="text-center text-xs text-gray-300 p-2">30</div>
                            
                            <!-- 当月日期 -->
                            <div class="text-center text-xs p-2 bg-chinese-red text-white rounded-full">1</div>
                            <div class="text-center text-xs p-2 bg-chinese-red text-white rounded-full">2</div>
                            <div class="text-center text-xs p-2 bg-chinese-red text-white rounded-full">3</div>
                            <div class="text-center text-xs p-2 bg-chinese-red text-white rounded-full">4</div>
                            <div class="text-center text-xs p-2 bg-chinese-red text-white rounded-full">5</div>
                            <div class="text-center text-xs p-2 bg-chinese-red text-white rounded-full">6</div>
                            <div class="text-center text-xs p-2 bg-chinese-red text-white rounded-full">7</div>
                            <div class="text-center text-xs p-2">8</div>
                            <div class="text-center text-xs p-2">9</div>
                            <div class="text-center text-xs p-2">10</div>
                            <div class="text-center text-xs p-2">11</div>
                            <div class="text-center text-xs p-2">12</div>
                            <div class="text-center text-xs p-2">13</div>
                            <div class="text-center text-xs p-2">14</div>
                            <div class="text-center text-xs p-2">15</div>
                            <div class="text-center text-xs p-2">16</div>
                            <div class="text-center text-xs p-2">17</div>
                            <div class="text-center text-xs p-2">18</div>
                            <div class="text-center text-xs p-2">19</div>
                            <div class="text-center text-xs p-2">20</div>
                            <div class="text-center text-xs p-2">21</div>
                            <div class="text-center text-xs p-2">22</div>
                            <div class="text-center text-xs p-2">23</div>
                            <div class="text-center text-xs p-2">24</div>
                            <div class="text-center text-xs p-2">25</div>
                            <div class="text-center text-xs p-2">26</div>
                            <div class="text-center text-xs p-2">27</div>
                            <div class="text-center text-xs p-2">28</div>
                            <div class="text-center text-xs p-2">29</div>
                            <div class="text-center text-xs p-2">30</div>
                            <div class="text-center text-xs p-2">31</div>
                        </div>
                    </div>
                </div>
                
                <!-- 积分规则 -->
                <div class="mb-6">
                    <h3 class="font-bold text-lg text-chinese-red mb-3">积分规则</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3">
                            <div class="flex items-center justify-between mb-2">
                                <iconify-icon class="text-chinese-red text-xl" icon="mdi:calendar-check"></iconify-icon>
                                <span class="text-sm font-bold text-chinese-red">+5积分</span>
                            </div>
                            <p class="text-xs text-gray-700">每日签到</p>
                        </div>
                        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3">
                            <div class="flex items-center justify-between mb-2">
                                <iconify-icon class="text-chinese-red text-xl" icon="mdi:calendar-check"></iconify-icon>
                                <span class="text-sm font-bold text-chinese-red">+10积分</span>
                            </div>
                            <p class="text-xs text-gray-700">连续签到7天</p>
                        </div>
                        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3">
                            <div class="flex items-center justify-between mb-2">
                                <iconify-icon class="text-chinese-red text-xl" icon="mdi:calendar-check"></iconify-icon>
                                <span class="text-sm font-bold text-chinese-red">+20积分</span>
                            </div>
                            <p class="text-xs text-gray-700">连续签到30天</p>
                        </div>
                        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3">
                            <div class="flex items-center justify-between mb-2">
                                <iconify-icon class="text-chinese-red text-xl" icon="mdi:ticket-confirmation"></iconify-icon>
                                <span class="text-sm font-bold text-chinese-red">+50积分</span>
                            </div>
                            <p class="text-xs text-gray-700">参与活动</p>
                        </div>
                    </div>
                </div>
                
                <!-- 我的积分 -->
                <div>
                    <h3 class="font-bold text-lg text-chinese-red mb-3">我的积分</h3>
                    <div class="bg-white border border-amber-200 rounded-xl p-4">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-gray-600">当前积分</span>
                            <span class="text-2xl font-bold text-chinese-red">1,250</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">积分可用于</span>
                            <div class="flex space-x-2">
                                <span class="text-xs bg-amber-50 text-chinese-red px-2 py-1 rounded-full">兑换礼品</span>
                                <span class="text-xs bg-amber-50 text-chinese-red px-2 py-1 rounded-full">抵扣费用</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- 底部导航栏 -->
        <nav class="h-20 bg-white border-t border-amber-300 flex justify-around items-center">
            <div class="text-center text-gray-400 cursor-pointer nav-item" data-page="home">
                <iconify-icon class="text-2xl block mx-auto" icon="mdi:home"></iconify-icon>
                <span class="text-xs mt-1">首页</span>
            </div>
            <div class="text-center text-gray-400 cursor-pointer nav-item" data-page="activity">
                <iconify-icon class="text-2xl block mx-auto" icon="mdi:calendar"></iconify-icon>
                <span class="text-xs mt-1">活动</span>
            </div>
            <div class="text-center text-gray-400 cursor-pointer nav-item" data-page="profile">
                <iconify-icon class="text-2xl block mx-auto" icon="mdi:account"></iconify-icon>
                <span class="text-xs mt-1">我的</span>
            </div>
        </nav>
    </div>
    
    <script>
                // 返回按钮点击事件
        document.getElementById('back-btn').addEventListener('click', function() {
                 window.location.href = '德州财金集团H5.html#activity-page';
        });

        // 签到按钮点击事件
        document.getElementById('check-in-btn').addEventListener('click', function() {
            alert('签到成功！获得5积分');
        });
        
        // 导航栏点击事件 - 跳转到主页面对应模块
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                const page = this.dataset.page;
                window.location.href = `德州财金集团H5.html#${page}`;
            });
        });
    </script>
</body>
</html>
